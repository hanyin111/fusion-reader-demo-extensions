<!doctype html>
<html lang="zh-CN"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>聚阅 · 原创阅读演示</title>
<style>body{margin:0;background:#f7f3fa;color:#39294a;font:16px/1.8 system-ui,sans-serif}main{max-width:760px;margin:auto;padding:64px 24px}h1{font-size:36px;line-height:1.2}small{color:#766781}.books{display:flex;gap:16px;margin:32px 0}.books img{width:30%;border-radius:8px}button{background:#624580;color:white;border:0;border-radius:12px;padding:14px 24px;font:inherit;cursor:pointer}code{display:block;background:white;border-radius:12px;padding:16px;margin:20px 0;overflow-wrap:anywhere}a{color:#624580}</style>
<main><small>聚阅 · 独立演示仓库</small><h1>从三本小书，<br>开始一次阅读。</h1><p>三篇原创短篇，九个完整章节。用于演示来源安装、搜索、阅读、缓存及 JSON 数据迁移，无需账号。</p><div class="books"><img src="covers/letter.png" alt="山间来信"><img src="covers/paper.png" alt="纸上旅行"><img src="covers/morning.png" alt="晨光札记"></div><p>在聚阅的「扩展 → 插件仓库」中输入下方索引地址，然后安装「聚阅原创阅读演示」。</p><code id="url">https://hanyin111.github.io/fusion-reader-demo-extensions/index.json</code><button id="copy">复制索引地址</button><p role="status" id="status"></p><small>本仓库仅含原创演示作品，不关联其他内容仓库。脚本和原创文字按 MIT 许可提供。</small></main>
<script>document.querySelector('#copy').onclick=async()=>{try{await navigator.clipboard.writeText(document.querySelector('#url').textContent);document.querySelector('#status').textContent='已复制';}catch{document.querySelector('#status').textContent='请长按或选中上方地址复制';}};</script></html>
